databases:
  - name: opencampus-db
    plan: free
    databaseName: opencampus
    user: opencampus

services:
  - type: web
    name: opencampus-api
    runtime: docker
    rootDir: backend
    plan: free
    healthCheckPath: /api/health
    envVars:
      - key: DB_HOST
        fromDatabase:
          name: opencampus-db
          property: host
      - key: DB_PORT
        fromDatabase:
          name: opencampus-db
          property: port
      - key: DB_NAME
        fromDatabase:
          name: opencampus-db
          property: database
      - key: DB_USER
        fromDatabase:
          name: opencampus-db
          property: user
      - key: DB_PASSWORD
        fromDatabase:
          name: opencampus-db
          property: password
      - key: CORS_ALLOWED_ORIGINS
        value: "*"
      - key: OPENAI_MODEL
        value: gpt-4o-mini

  - type: web
    name: opencampus-web
    runtime: static
    rootDir: frontend
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_BASE_URL
        value: https://opencampus-api.onrender.com/api
